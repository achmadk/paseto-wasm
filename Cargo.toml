[package]
name = "paseto-wasm"
version = "2.0.1"
edition = "2021"
authors = ["Achmad Kurnianto <me@achmadk.com>"]
description = "execute PASETO methods inside WASM (web assembly)"
repository = "https://github.com/achmadk/paseto-wasm"
license = "MIT"
readme = "readme.md"
keywords = ["PASETO", "cryptography", "JWT", "JWE"]
categories = ["development-tools"]

[features]
default = ["v4"]
v4 = ["dep:ed25519-dalek", "dep:chacha20"]
v3 = ["dep:aes", "dep:ctr", "dep:digest", "dep:hkdf", "dep:hmac", "dep:sha2", "dep:p384"]
v5 = ["dep:aes", "dep:ctr", "dep:digest", "dep:hkdf", "dep:hmac", "dep:sha2"]
v6 = ["dep:chacha20", "dep:slh-dsa", "dep:rand_core"]

[lib]

crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.4", features = ["wasm_js", "sys_rng"] }
hex = "0.4"
ed25519-dalek = { version = "3.0", optional = true }
base64 = "0.23"
blake2 = "0.11"
digest = { version = "0.11", optional = true }
subtle = "2.6"
chacha20 = { version = "0.9", optional = true }
aes = { version = "0.9", optional = true }
ctr = { version = "0.10", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
p384 = { version = "0.14", features = ["std", "pem"], optional = true }
hkdf = { version = "0.13", optional = true }
slh-dsa = { version = "0.2.0-rc.5", optional = true }
rand_core = { version = "0.10", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
